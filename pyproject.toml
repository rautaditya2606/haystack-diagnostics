[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haystack-diagnostics"
version = "0.1.0"
description = "A diagnostics and health engine for Haystack 2.x pipelines and document stores"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "haystack-ai>=2.29.0",  # 2.29.0 is the minimum tested version; see requirements.txt for the pinned lockfile
    "mcp>=1.0.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
include = ["diagnostics*", "mcp*"]
